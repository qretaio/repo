[package]
name = "repo"
version = "0.8.0"
edition = "2021"
description = "Universal CLI for repository operations - lint, build, format, test across languages"
license = "MIT"

[[bin]]
name = "repo"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde_json = "1"
serde = { version = "1", features = ["derive"] }
colored = "3"
which = "8"
duct = "1"
anyhow = "1"
cel-interpreter = "0.10"
serde_yaml = "0.9"
glob = "0.3"
indexmap = { version = "2", features = ["serde"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
