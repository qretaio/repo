[package]
name = "repo"
version = "0.8.0"
edition = "2021"
description = "Universal CLI for repository operations - lint, build, format, test across languages"
license = "MIT"

[[bin]]
name = "repo"
path = "src/main.rs"

[dependencies]
# cli-battery-pack v0.6 curated subset (battery-pack-rs) — same curation the
# `mem` CLI uses, relevant pieces only: anyhow + clap(+derive,+env) below;
# wild for glob arg expansion; human-panic for human-friendly panics.
# Skipped as irrelevant: anstream/anstyle + colorchoice-clap (repo's color
# story is `colored`, piped-aware via tty detection — swapping every call
# site is churn), dialoguer (non-interactive), indicatif/console (no
# progress UI), etcetera (would break the documented XDG-on-macOS default).
clap = { version = "4.6", features = ["derive", "env"] }
human-panic = "2.0"
wild = "2.2"
serde_json = "1"
serde = { version = "1", features = ["derive"] }
colored = "3"
which = "8"
duct = "1"
anyhow = "1"
cel-interpreter = "0.10"
serde_yaml = "0.9"
glob = "0.3"
indexmap = { version = "2", features = ["serde"] }
regex = "1"
tantivy = "0.26.1"
tree-sitter = "0.26"
tree-sitter-rust = "0.24"
tree-sitter-python = "0.25"
tree-sitter-javascript = "0.25"
tree-sitter-typescript = "0.23"
tree-sitter-go = "0.25"
rusqlite = { version = "0.40", features = ["bundled"] }
ureq = { version = "2", features = ["json"] }
rmcp = { version = "3.1.3", default-features = false, features = ["macros", "server", "transport-io"] }
tokio = { version = "1.53.1", features = ["rt-multi-thread"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
