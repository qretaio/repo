[package]
name = "repo"
version = "0.8.0"
edition = "2021"
description = "Universal CLI for repository operations - lint, build, format, test across languages"
license = "MIT"

[[bin]]
name = "repo"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde_json = "1"
colored = "2"
which = "7"
duct = "0.13"
anyhow = "1"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
